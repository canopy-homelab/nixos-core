# Example Repository Identity Registry Template
# Live production deployments are configured in ~/Workloads/deployments.yaml
# (or overridden via the HOMELAB_DEPLOYMENTS_FILE environment variable).
#
# Owns: repository identity, canonical filesystem path, and aliases.
# Enforces: strict path containment within ~/Workloads (WORKLOADS_DIR).

schemaVersion: "1.0"
repositories:
  example-app:
    path: "~/Workloads/example-app"
    aliases:
      - "example"
      - "homelab-example"
  example-docs:
    path: "~/Workloads/example-docs"
    aliases:
      - "docs"
