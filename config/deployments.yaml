# Core Authoritative Repository Identity Registry
# Governs admitted continuous deployment targets for GitOps webhook execution.
# Owns: repository identity, canonical filesystem path, and aliases.
# Enforces: strict path containment within ~/Workloads.

schemaVersion: "1.0"
repositories:
  snappymail:
    path: "~/Workloads/snappymail"
    aliases:
      - "homelab-snappymail"
      - "mail"
      - "webmail"
  gitea:
    path: "~/Workloads/homelab-gitea"
    aliases:
      - "homelab-gitea"
      - "git"
  jellyfin:
    path: "~/Workloads/homelab-jellyfin"
    aliases:
      - "homelab-jellyfin"
      - "media"
  courses:
    path: "~/Workloads/courses"
    aliases:
      - "homelab-courses"
  bdinvite:
    path: "~/Workloads/homelab-bdinvite"
    aliases:
      - "homelab-bdinvite"
      - "birthday"
  landing:
    path: "~/Workloads/homelab-landing"
    aliases:
      - "homelab-landing"
  mermaid:
    path: "~/Workloads/homelab-mermaid"
    aliases:
      - "homelab-mermaid"
  excalidraw:
    path: "~/Workloads/homelab-excalidraw"
    aliases:
      - "homelab-excalidraw"
  houston:
    path: "~/Workloads/homelab-houston"
    aliases:
      - "homelab-houston"
